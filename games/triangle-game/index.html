<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Triangle — Number Placement Game</title>
<style>
  :root{
    --bg-0: #05070d;
    --bg-1: #0b0f18;
    --panel: #10141f;
    --panel-border: #1e2434;
    --text-hi: #e8ecf6;
    --text-mid: #8b93a7;
    --text-dim: #545c70;

    --p1: #4f8dff;
    --p1-glow: #4f8dffaa;
    --p1-soft: #4f8dff22;

    --p2: #2fe3a3;
    --p2-glow: #2fe3a3aa;
    --p2-soft: #2fe3a322;

    --gold: #f5b942;
    --gold-glow: #f5b942aa;

    --font-display: 'Outfit', 'Segoe UI', sans-serif;
    --font-num: 'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #131a2c 0%, var(--bg-0) 55%);
    color: var(--text-hi);
    font-family: var(--font-display);
    min-height: 100vh;
    overflow-x: hidden;
  }

  @font-face {
    font-family: 'Outfit';
    src: local('Arial');
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px 40px;
    position: relative;
  }

  /* ambient background glow blobs */
  .app::before, .app::after {
    content: '';
    position: fixed;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.14;
    z-index: 0;
    pointer-events: none;
  }
  .app::before { background: var(--p1); top: -180px; left: -160px; }
  .app::after  { background: var(--p2); bottom: -180px; right: -160px; }

  header.top {
    text-align: center;
    z-index: 1;
    margin-bottom: 18px;
  }
  header.top .eyebrow {
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  header.top h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--p1) 0%, var(--text-hi) 45%, var(--p2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* turn indicator */
  .turn-bar {
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 10px 20px;
    border-radius: 999px;
    margin-bottom: 22px;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s ease;
  }
  .turn-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .turn-bar.p1 .turn-dot { background: var(--p1); box-shadow: 0 0 12px 2px var(--p1-glow); }
  .turn-bar.p2 .turn-dot { background: var(--p2); box-shadow: 0 0 12px 2px var(--p2-glow); }
  .turn-bar.done .turn-dot { background: var(--gold); box-shadow: 0 0 12px 2px var(--gold-glow); }
  .turn-text { font-size: 14px; color: var(--text-mid); }
  .turn-text b { color: var(--text-hi); font-weight: 600; }

  /* main layout */
  .layout {
    z-index: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }

  .player-card {
    flex: 0 0 150px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 16px 14px;
    text-align: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .player-card .name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .player-card.pc1 .name { color: var(--p1); }
  .player-card.pc2 .name { color: var(--p2); }
  .player-card .badge {
    width: 46px;
    height: 46px;
    margin: 0 auto 10px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-num);
    font-weight: 700;
    font-size: 18px;
  }
  .player-card.pc1 .badge { background: var(--p1-soft); color: var(--p1); border: 2px solid var(--p1); }
  .player-card.pc2 .badge { background: var(--p2-soft); color: var(--p2); border: 2px solid var(--p2); }
  .player-card .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 2px; }
  .player-card .score { font-family: var(--font-num); font-size: 26px; font-weight: 700; color: var(--text-dim); }
  .player-card.active { border-color: currentColor; transform: translateY(-2px); }
  .player-card.pc1.active { box-shadow: 0 0 0 1px var(--p1), 0 10px 30px -10px var(--p1-glow); color: var(--p1); }
  .player-card.pc2.active { box-shadow: 0 0 0 1px var(--p2), 0 10px 30px -10px var(--p2-glow); color: var(--p2); }
  .player-card.winner .score { color: var(--gold); }
  .player-card.winner { box-shadow: 0 0 0 1px var(--gold), 0 10px 30px -10px var(--gold-glow); }

  /* board */
  .board-wrap {
    position: relative;
    width: min(480px, 62vw);
    flex-shrink: 0;
  }
  .board-inner {
    position: relative;
    width: 100%;
  }
  .board-inner svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; }
  .board-inner svg line {
    stroke: #2a3145;
    stroke-width: 1.5;
    transition: stroke 0.4s ease, stroke-width 0.4s ease;
  }
  .board-inner svg line.lit { stroke: var(--gold); stroke-width: 2.5; }

  .cell {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-num);
    font-weight: 700;
    background: #131a29;
    border: 2px solid #2a3145;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    transform: translate(-50%, -50%) scale(1);
    transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease, opacity 0.3s ease;
  }
  .cell.empty:hover {
    transform: translate(-50%, -50%) scale(1.1);
    border-color: #4a5370;
    background: #171f31;
  }
  .cell.filled { cursor: default; animation: pop 0.32s cubic-bezier(.34,1.56,.64,1); }
  .cell.p1 { color: var(--p1); border-color: var(--p1); background: var(--p1-soft); box-shadow: 0 0 18px -2px var(--p1-glow); }
  .cell.p2 { color: var(--p2); border-color: var(--p2); background: var(--p2-soft); box-shadow: 0 0 18px -2px var(--p2-glow); }
  .cell.final-empty {
    border-color: var(--gold);
    color: var(--gold);
    background: #241d0d;
    box-shadow: 0 0 0 3px var(--gold-glow), 0 0 24px 4px var(--gold-glow);
    animation: pulseGold 1.4s ease-in-out infinite;
  }
  .cell.adjacent-highlight { animation: adjPulse 1.4s ease-in-out infinite; }
  .cell.dim { opacity: 0.35; }

  @keyframes pop {
    0% { transform: translate(-50%,-50%) scale(0.4); opacity: 0; }
    70% { transform: translate(-50%,-50%) scale(1.14); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); }
  }
  @keyframes pulseGold {
    0%,100% { box-shadow: 0 0 0 3px var(--gold-glow), 0 0 24px 4px var(--gold-glow); }
    50% { box-shadow: 0 0 0 6px var(--gold-glow), 0 0 40px 10px var(--gold-glow); }
  }
  @keyframes adjPulse {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.5); }
  }

  /* controls */
  .controls {
    z-index: 1;
    display: flex;
    gap: 12px;
    margin-top: 26px;
  }
  .btn {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text-hi);
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); border-color: #3a4257; background: #161c2b; }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(90deg, var(--p1), var(--p2)); border: none; color: #05070d; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* winner overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,7,13,0.72);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .win-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 36px 40px;
    text-align: center;
    max-width: 380px;
    width: 90vw;
    transform: scale(0.85) translateY(10px);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.4s ease;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }
  .overlay.show .win-card { transform: scale(1) translateY(0); opacity: 1; }
  .win-card .crown { font-size: 40px; margin-bottom: 6px; }
  .win-card .eyebrow2 {
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
  }
  .win-card h2 {
    margin: 0 0 22px;
    font-size: 26px;
    font-weight: 700;
  }
  .win-card h2.p1 { color: var(--p1); text-shadow: 0 0 20px var(--p1-glow); }
  .win-card h2.p2 { color: var(--p2); text-shadow: 0 0 20px var(--p2-glow); }
  .win-card h2.tie { color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
  .score-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 26px;
  }
  .score-box {
    flex: 1;
    background: var(--bg-1);
    border-radius: 14px;
    padding: 14px 10px;
    border: 1px solid var(--panel-border);
  }
  .score-box .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .score-box .val { font-family: var(--font-num); font-size: 28px; font-weight: 700; }
  .score-box.b1 .val { color: var(--p1); }
  .score-box.b2 .val { color: var(--p2); }

  @media (max-width: 720px) {
    .layout { flex-direction: column; align-items: center; }
    .player-card { flex: 0 0 auto; width: 100%; max-width: 300px; display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 16px; }
    .player-card .badge { margin: 0; flex-shrink: 0; }
    .player-card .name { margin-bottom: 4px; }
    .player-card .score-line { display: flex; align-items: baseline; gap: 6px; }
    .board-wrap { width: min(420px, 90vw); order: -1; margin-bottom: 4px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="eyebrow">Two Players · One Empty Circle</div>
    <h1>Triangle</h1>
  </header>

  <div class="turn-bar" id="turnBar">
    <div class="turn-dot" id="turnDot"></div>
    <div class="turn-text" id="turnText">—</div>
  </div>

  <div class="layout">
    <div class="player-card pc1" id="card1">
      <div class="name">Player 1</div>
      <div class="badge" id="badge1">1</div>
      <div class="label">Score</div>
      <div class="score" id="score1">—</div>
    </div>

    <div class="board-wrap">
      <div class="board-inner" id="boardInner">
        <svg id="boardSvg"></svg>
      </div>
    </div>

    <div class="player-card pc2" id="card2">
      <div class="name">Player 2</div>
      <div class="badge" id="badge2">1</div>
      <div class="label">Score</div>
      <div class="score" id="score2">—</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="undoBtn" disabled>Undo</button>
    <button class="btn" id="restartBtn">Restart</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="win-card" id="winCard">
    <div class="crown" id="crownIcon">🏆</div>
    <div class="eyebrow2">Game Over</div>
    <h2 id="winTitle">—</h2>
    <div class="score-row">
      <div class="score-box b1">
        <div class="lbl">Player 1</div>
        <div class="val" id="finalScore1">0</div>
      </div>
      <div class="score-box b2">
        <div class="lbl">Player 2</div>
        <div class="val" id="finalScore2">0</div>
      </div>
    </div>
    <button class="btn primary" id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const ROWS = 6; // rows 0..5, row r has r+1 circles

  /* ---------- state ---------- */
  let board = [];      // board[r][c] = { row, col, player, number } or null
  let history = [];     // list of {row, col}
  let moveCount = 0;
  let gameOver = false;
  let cellEls = [];     // DOM refs mirrored to board shape
  let lineEls = [];     // svg line elements keyed by "r1,c1-r2,c2"
  let positions = [];   // pixel positions per cell

  /* ---------- DOM refs ---------- */
  const boardInner = document.getElementById('boardInner');
  const boardSvg = document.getElementById('boardSvg');
  const turnBar = document.getElementById('turnBar');
  const turnDot = document.getElementById('turnDot');
  const turnText = document.getElementById('turnText');
  const card1 = document.getElementById('card1');
  const card2 = document.getElementById('card2');
  const badge1 = document.getElementById('badge1');
  const badge2 = document.getElementById('badge2');
  const score1El = document.getElementById('score1');
  const score2El = document.getElementById('score2');
  const undoBtn = document.getElementById('undoBtn');
  const restartBtn = document.getElementById('restartBtn');
  const overlay = document.getElementById('overlay');
  const winTitle = document.getElementById('winTitle');
  const finalScore1 = document.getElementById('finalScore1');
  const finalScore2 = document.getElementById('finalScore2');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const crownIcon = document.getElementById('crownIcon');

  /* ---------- adjacency ---------- */
  function neighborCoords(r, c) {
    const cand = [
      [r, c - 1], [r, c + 1],
      [r - 1, c - 1], [r - 1, c],
      [r + 1, c], [r + 1, c + 1]
    ];
    return cand.filter(([nr, nc]) => nr >= 0 && nr < ROWS && nc >= 0 && nc <= nr);
  }

  /* ---------- setup ---------- */
  function initState() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c <= r; c++) row.push(null);
      board.push(row);
    }
    history = [];
    moveCount = 0;
    gameOver = false;
  }

  function buildDom() {
    boardInner.querySelectorAll('.cell').forEach(el => el.remove());
    boardSvg.innerHTML = '';
    cellEls = [];
    lineEls = {};

    for (let r = 0; r < ROWS; r++) {
      const rowEls = [];
      for (let c = 0; c <= r; c++) {
        const el = document.createElement('div');
        el.className = 'cell empty';
        el.dataset.row = r;
        el.dataset.col = c;
        el.addEventListener('click', () => onCellClick(r, c));
        boardInner.appendChild(el);
        rowEls.push(el);
      }
      cellEls.push(rowEls);
    }

    // build svg edges: right-neighbor, lower-left, lower-right (covers every edge once)
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= r; c++) {
        const targets = [[r, c + 1], [r + 1, c], [r + 1, c + 1]];
        targets.forEach(([tr, tc]) => {
          if (tr < ROWS && tc >= 0 && tc <= tr) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            const key = r + ',' + c + '-' + tr + ',' + tc;
            line.dataset.key = key;
            boardSvg.appendChild(line);
            lineEls[key] = line;
          }
        });
      }
    }

    layout();
  }

  function layout() {
    const width = boardInner.clientWidth || boardInner.parentElement.clientWidth;
    const spacing = width / (ROWS + 0.6);
    const circleSize = spacing * 0.86;
    const rowHeight = spacing * 0.88;
    const topPad = circleSize / 2 + 4;

    positions = [];
    let maxY = 0;

    for (let r = 0; r < ROWS; r++) {
      const rowWidth = (r + 1) * spacing;
      const startX = (width - rowWidth) / 2 + spacing / 2;
      const y = r * rowHeight + topPad;
      const rowPos = [];
      for (let c = 0; c <= r; c++) {
        const x = startX + c * spacing;
        rowPos.push({ x, y });
        const el = cellEls[r][c];
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = circleSize + 'px';
        el.style.height = circleSize + 'px';
        el.style.fontSize = (circleSize * 0.36) + 'px';
      }
      positions.push(rowPos);
      maxY = y;
    }

    const totalHeight = maxY + circleSize / 2 + 4;
    boardInner.style.height = totalHeight + 'px';
    boardSvg.setAttribute('viewBox', `0 0 ${width} ${totalHeight}`);
    boardSvg.style.height = totalHeight + 'px';

    // position lines
    Object.keys(lineEls).forEach(key => {
      const [a, b] = key.split('-');
      const [r1, c1] = a.split(',').map(Number);
      const [r2, c2] = b.split(',').map(Number);
      const p1 = positions[r1][c1];
      const p2 = positions[r2][c2];
      const line = lineEls[key];
      line.setAttribute('x1', p1.x);
      line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x);
      line.setAttribute('y2', p2.y);
    });
  }

  /* ---------- turn helpers ---------- */
  function currentPlayer() { return moveCount % 2 === 0 ? 1 : 2; }
  function currentNumber() { return Math.floor(moveCount / 2) + 1; }

  /* ---------- rendering state ---------- */
  function renderCell(r, c) {
    const el = cellEls[r][c];
    const data = board[r][c];
    el.classList.remove('final-empty', 'adjacent-highlight', 'dim');
    if (data) {
      el.classList.remove('empty');
      el.classList.add('filled', 'p' + data.player);
      el.textContent = data.number;
    } else {
      el.classList.remove('filled', 'p1', 'p2');
      el.classList.add('empty');
      el.textContent = '';
    }
  }

  function renderAll() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= r; c++) renderCell(r, c);
    }
    updateTurnUI();
  }

  function updateTurnUI() {
    if (gameOver) {
      turnBar.className = 'turn-bar done';
      turnText.innerHTML = '<b>Game finished</b> — scoring circle revealed';
      badge1.textContent = '—';
      badge2.textContent = '—';
      card1.classList.remove('active');
      card2.classList.remove('active');
      undoBtn.disabled = history.length === 0;
      return;
    }
    const p = currentPlayer();
    const n = currentNumber();
    turnBar.className = 'turn-bar p' + p;
    turnText.innerHTML = `<b>Player ${p}</b>'s turn — place number <b>${n}</b>`;

    card1.classList.toggle('active', p === 1);
    card2.classList.toggle('active', p === 2);
    badge1.textContent = p === 1 ? n : (n + (p === 1 ? 0 : (moveCount % 2 === 1 ? 0 : 0)));
    // next number each player will place
    const p1Next = Math.floor((moveCount + (p === 1 ? 0 : 1)) / 2) + 1;
    const p2Next = Math.floor((moveCount + (p === 2 ? 0 : 1)) / 2) + 1;
    badge1.textContent = Math.min(p1Next, 10);
    badge2.textContent = Math.min(p2Next, 10);

    undoBtn.disabled = history.length === 0;
  }

  /* ---------- interactions ---------- */
  function onCellClick(r, c) {
    if (gameOver) return;
    if (board[r][c]) return;

    const player = currentPlayer();
    const number = currentNumber();
    board[r][c] = { row: r, col: c, player, number };
    history.push({ row: r, col: c });
    moveCount++;

    renderCell(r, c);
    updateTurnUI();

    if (moveCount === ROWS * (ROWS + 1) / 2 - 1) {
      endGame();
    }
  }

  function undo() {
    if (history.length === 0) return;
    if (gameOver) {
      gameOver = false;
      overlay.classList.remove('show');
      clearHighlights();
    }
    const last = history.pop();
    board[last.row][last.col] = null;
    moveCount--;
    renderCell(last.row, last.col);
    updateTurnUI();
  }

  function clearHighlights() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= r; c++) {
        cellEls[r][c].classList.remove('final-empty', 'adjacent-highlight', 'dim');
      }
    }
    Object.values(lineEls).forEach(l => l.classList.remove('lit'));
  }

  function endGame() {
    gameOver = true;

    // find the single empty cell
    let emptyR = -1, emptyC = -1;
    outer:
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= r; c++) {
        if (!board[r][c]) { emptyR = r; emptyC = c; break outer; }
      }
    }

    const neighbors = neighborCoords(emptyR, emptyC);
    let score1 = 0, score2 = 0;

    // dim everything first, then highlight relevant ones
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c <= r; c++) {
        cellEls[r][c].classList.add('dim');
      }
    }
    cellEls[emptyR][emptyC].classList.remove('dim');
    cellEls[emptyR][emptyC].classList.add('final-empty');

    neighbors.forEach(([nr, nc]) => {
      const cell = cellEls[nr][nc];
      cell.classList.remove('dim');
      cell.classList.add('adjacent-highlight');
      const data = board[nr][nc];
      if (data) {
        if (data.player === 1) score1 += data.number;
        else score2 += data.number;
      }
      // light the connecting line
      const keyA = emptyR + ',' + emptyC + '-' + nr + ',' + nc;
      const keyB = nr + ',' + nc + '-' + emptyR + ',' + emptyC;
      if (lineEls[keyA]) lineEls[keyA].classList.add('lit');
      if (lineEls[keyB]) lineEls[keyB].classList.add('lit');
    });

    score1El.textContent = score1;
    score2El.textContent = score2;

    updateTurnUI();

    setTimeout(() => showWinner(score1, score2), 650);
  }

  function showWinner(score1, score2) {
    finalScore1.textContent = score1;
    finalScore2.textContent = score2;
    card1.classList.remove('winner');
    card2.classList.remove('winner');

    if (score1 < score2) {
      winTitle.textContent = 'Player 1 Wins';
      winTitle.className = 'p1';
      crownIcon.textContent = '🏆';
      card1.classList.add('winner');
    } else if (score2 < score1) {
      winTitle.textContent = 'Player 2 Wins';
      winTitle.className = 'p2';
      crownIcon.textContent = '🏆';
      card2.classList.add('winner');
    } else {
      winTitle.textContent = "It's a Tie";
      winTitle.className = 'tie';
      crownIcon.textContent = '🤝';
    }

    overlay.classList.add('show');
  }

  /* ---------- restart ---------- */
  function restart() {
    initState();
    overlay.classList.remove('show');
    buildDom();
    renderAll();
  }

  /* ---------- init ---------- */
  window.addEventListener('resize', layout);
  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', restart);
  playAgainBtn.addEventListener('click', restart);

  initState();
  buildDom();
  renderAll();
})();
</script>

</body>
</html>
