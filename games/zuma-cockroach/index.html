<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>زوما الصراصير</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui;text-align:center}header{padding:10px}button,select{background:#8b5cf6;color:white;border:0;border-radius:12px;padding:10px 16px;font-size:16px}#game{display:block;width:min(100vw,850px);height:auto;touch-action:none;margin:auto;border:3px solid #655293;border-radius:18px;background:#252038}small{color:#b9b5c8}#hud{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px}</style><header><h2>🪳 زوما الصراصير</h2><div id="hud"><span id="stats"></span><button id="start">ابدأ / أعد المرحلة</button><button id="swap">بدّل الحشرة 🔄</button><select id="level"></select></div><small>المس الشاشة أو انقر للتصويب والإطلاق • اجمع 3 حشرات من اللون نفسه</small></header><canvas id="game" width="800" height="560"></canvas><script>
(()=>{'use strict';
const c=document.getElementById('game'),x=c.getContext('2d'),stats=document.getElementById('stats'),sel=document.getElementById('level');
const colors=['#ff5b70','#52d3f2','#f9d34f','#79e582','#c78bff','#ff9d4e'];let stage=1,score=0,chain=[],shots=[],running=false,ended=false,aim=-Math.PI/2,current=0,next=1,last=0,spawned=0,spawnClock=0,combo=0;
const configs=Array.from({length:15},(_,i)=>({speed:24+i*5.8,total:20+i*5,interval:1.35-i*.045,palette:3+Math.floor(i/3),shape:i%5}));
for(let i=1;i<=15;i++){let o=document.createElement('option');o.value=i;o.textContent='المرحلة '+i;sel.append(o)}sel.onchange=()=>{stage=+sel.value;reset()};document.getElementById('start').onclick=reset;document.getElementById('swap').onclick=()=>{[current,next]=[next,current]};
const center={x:400,y:290},radius=15;let path=[],length=0;
function build(){path=[];let k=configs[stage-1].shape;for(let t=0;t<=1.0001;t+=.002){let a,p;if(k===0){a=3.4*Math.PI*t+Math.PI;p=245-165*t}else if(k===1){a=4.1*Math.PI*t+Math.PI;p=230-145*t}else if(k===2){a=3.7*Math.PI*t+Math.PI/2;p=235-145*t}else if(k===3){a=4.4*Math.PI*t;p=240-155*t}else{a=3.9*Math.PI*t+Math.PI;p=240-160*t}let xx=center.x+Math.cos(a)*p,yy=center.y+Math.sin(a)*p*.77;let prev=path[path.length-1],d=prev?Math.hypot(xx-prev.x,yy-prev.y):0;length+=d;path.push({x:xx,y:yy,d:length})}}
function point(d){if(d<=0)return path[0];if(d>=length)return path[path.length-1];let lo=0,hi=path.length-1;while(lo<hi){let m=(lo+hi)>>1;if(path[m].d<d)lo=m+1;else hi=m}let a=path[Math.max(0,lo-1)],b=path[lo],t=(d-a.d)/(b.d-a.d||1);return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function reset(){stage=+sel.value;length=0;build();score=0;chain=[];shots=[];running=true;ended=false;spawned=0;spawnClock=0;combo=0;current=Math.floor(Math.random()*configs[stage-1].palette);next=Math.floor(Math.random()*configs[stage-1].palette);stats.textContent='المرحلة '+stage+' | النقاط 0'}
function addBug(){let palette=configs[stage-1].palette;let color=Math.floor(Math.random()*palette);if(chain.length&&Math.random()<.55)color=chain[chain.length-1].color;chain.push({d:-radius*2,color})}
function drawBug(px,py,color,r=radius){x.save();x.translate(px,py);x.fillStyle=colors[color];x.strokeStyle='#171324';x.lineWidth=2.5;x.beginPath();x.ellipse(0,0,r*.8,r,0,0,7);x.fill();x.stroke();x.beginPath();x.moveTo(-5,-r*.6);x.lineTo(-12,-r*1.35);x.moveTo(5,-r*.6);x.lineTo(12,-r*1.35);for(let j=-1;j<=1;j++){x.moveTo(-r*.7,j*7);x.lineTo(-r*1.15,j*9);x.moveTo(r*.7,j*7);x.lineTo(r*1.15,j*9)}x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(-4,-3,3,0,7);x.arc(4,-3,3,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-4,-3,1.4,0,7);x.arc(4,-3,1.4,0,7);x.fill();x.restore()}
function drawRoach(){x.save();x.translate(center.x,center.y);x.rotate(aim+Math.PI/2);x.strokeStyle='#12101c';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(-12,-20);x.lineTo(-24,-76);x.moveTo(12,-20);x.lineTo(24,-76);x.stroke();x.fillStyle='#dd62cf';x.beginPath();x.ellipse(0,12,34,44,0,0,7);x.fill();x.stroke();x.fillStyle='#9a76d6';x.beginPath();x.ellipse(0,-15,44,28,0,0,7);x.fill();x.stroke();x.fillStyle='#ff8c9c';x.beginPath();x.arc(-13,-25,11,0,7);x.fill();x.fillStyle='#ffe87c';x.beginPath();x.arc(13,-25,11,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-10,-24,3,0,7);x.arc(10,-24,3,0,7);x.fill();x.restore();drawBug(center.x+Math.cos(aim)*47,center.y+Math.sin(aim)*47,current,11)}
function fire(px,py){if(!running)return;let a=Math.atan2(py-center.y,px-center.x);aim=a;shots.push({x:center.x+Math.cos(a)*48,y:center.y+Math.sin(a)*48,vx:Math.cos(a)*470,vy:Math.sin(a)*470,color:current});current=next;next=Math.floor(Math.random()*configs[stage-1].palette)}
function hit(s){let best=-1,dist=28;for(let i=0;i<chain.length;i++){if(chain[i].d<0)continue;let p=point(chain[i].d),v=Math.hypot(s.x-p.x,s.y-p.y);if(v<dist){best=i;dist=v}}if(best<0)return false;let at=best+(s.x-point(chain[best].d).x+s.y-point(chain[best].d).y>0?1:0);let d=chain[best].d+(at>best?16:-16);chain.splice(at,0,{d,color:s.color});for(let j=at+1;j<chain.length;j++)chain[j].d=Math.max(chain[j].d,chain[j-1].d+30);let l=at,r=at;while(l>0&&chain[l-1].color===s.color)l--;while(r+1<chain.length&&chain[r+1].color===s.color)r++;if(r-l+1>=3){let n=r-l+1;chain.splice(l,n);score+=n*10*(++combo);for(let j=l;j<chain.length;j++)chain[j].d-=n*30}else combo=0;return true}
function update(dt){if(!running)return;let cfg=configs[stage-1];spawnClock+=dt;if(spawned<cfg.total&&spawnClock>=cfg.interval){spawnClock=0;addBug();spawned++}for(let i=0;i<chain.length;i++){chain[i].d+=cfg.speed*dt;if(i&&chain[i].d<chain[i-1].d+30)chain[i].d=chain[i-1].d+30}for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;if(hit(s)||s.x<0||s.x>800||s.y<0||s.y>560)shots.splice(i,1)}if(chain.some(b=>b.d>=length-15)){running=false;ended='خسرت! حاول مرة ثانية'}else if(spawned>=cfg.total&&chain.length===0){running=false;ended=stage===15?'مبروك! خلصت كل المراحل 🎉':'فزت! انتقل للمرحلة التالية';if(stage<15){sel.value=stage+1}}stats.textContent='المرحلة '+stage+' | النقاط '+score+' | المتبقي '+(cfg.total-spawned+chain.length)}
function render(){x.clearRect(0,0,800,560);let grad=x.createRadialGradient(400,280,20,400,280,490);grad.addColorStop(0,'#4a345c');grad.addColorStop(1,'#191e35');x.fillStyle=grad;x.fillRect(0,0,800,560);x.beginPath();path.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.strokeStyle='#100e23';x.lineWidth=38;x.stroke();x.strokeStyle='#746284';x.lineWidth=30;x.stroke();x.strokeStyle='#a38da8';x.lineWidth=2;x.stroke();let end=path[path.length-1];x.fillStyle='#f03b63';x.beginPath();x.arc(end.x,end.y,21,0,7);x.fill();for(let b of chain){if(b.d>=0){let p=point(b.d);drawBug(p.x,p.y,b.color)}}for(let s of shots)drawBug(s.x,s.y,s.color,10);drawRoach();drawBug(750,42,next,12);x.fillStyle='white';x.font='15px system-ui';x.fillText('التالي',700,23);if(!running){x.fillStyle='#080a14bb';x.fillRect(0,0,800,560);x.textAlign='center';x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText(ended||'اضغط ابدأ للعب',400,270);x.textAlign='start'}}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(frame)}function coords(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*560/r.height}}c.addEventListener('pointermove',e=>{let p=coords(e);aim=Math.atan2(p.y-center.y,p.x-center.x)});c.addEventListener('pointerdown',e=>{e.preventDefault();let p=coords(e);fire(p.x,p.y)});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();[current,next]=[next,current]}});length=0;build();requestAnimationFrame(frame);
})();
</script></html>
